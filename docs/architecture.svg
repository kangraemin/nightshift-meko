<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="-apple-system, Segoe UI, Roboto, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16181d"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a53"/></marker></defs><rect width="1200" height="700" fill="#ffffff"/><rect x="30" y="60" width="300" height="600" rx="12" fill="none" stroke="#c9cdd4" stroke-width="1.5" stroke-dasharray="6 5"/><text x="44" y="50" font-size="15" font-weight="700" fill="#16181d">On-call world (local)</text><rect x="50" y="80" width="260" height="110" rx="8" fill="#ffffff" stroke="#16181d" stroke-width="1.5"/><text x="64" y="106" font-size="16" font-weight="700" fill="#16181d">Pager simulator</text><text x="64" y="130" font-size="13.5" fill="#5b6270">40 pages over 20 nights</text><text x="64" y="150" font-size="13.5" fill="#5b6270">15 root causes, 3 traps</text><text x="64" y="170" font-size="13.5" fill="#5b6270">fix = id + target, checked</text><rect x="50" y="240" width="260" height="120" rx="8" fill="#ffffff" stroke="#0b7a53" stroke-width="2"/><text x="64" y="266" font-size="16" font-weight="700" fill="#16181d">Shift A agent</text><text x="64" y="290" font-size="13.5" fill="#5b6270">qwen3:8b via Ollama</text><text x="64" y="310" font-size="13.5" fill="#5b6270">triage, investigate, fix</text><text x="64" y="330" font-size="13.5" fill="#5b6270">Meko key of member A</text><rect x="50" y="400" width="260" height="120" rx="8" fill="#ffffff" stroke="#0b7a53" stroke-width="2"/><text x="64" y="426" font-size="16" font-weight="700" fill="#16181d">Shift B agent</text><text x="64" y="450" font-size="13.5" fill="#5b6270">same model, other shift</text><text x="64" y="470" font-size="13.5" fill="#5b6270">never talks to A directly</text><text x="64" y="490" font-size="13.5" fill="#5b6270">Meko key of member B</text><rect x="50" y="560" width="260" height="80" rx="8" fill="#ffffff" stroke="#16181d" stroke-width="1.5"/><text x="64" y="586" font-size="16" font-weight="700" fill="#16181d">Fixer guardrail</text><text x="64" y="610" font-size="13.5" fill="#5b6270">target must appear in evidence</text><rect x="400" y="60" width="420" height="600" rx="12" fill="none" stroke="#c9cdd4" stroke-width="1.5" stroke-dasharray="6 5"/><text x="414" y="50" font-size="15" font-weight="700" fill="#16181d">Meko Context Engine (MCP, one shared datapack)</text><rect x="420" y="80" width="380" height="90" rx="8" fill="#ffffff" stroke="#16181d" stroke-width="1.5"/><text x="434" y="106" font-size="16" font-weight="700" fill="#16181d">Conversations</text><text x="434" y="130" font-size="13.5" fill="#5b6270">one per page: reasoning, plan, decision trace</text><text x="434" y="150" font-size="13.5" fill="#5b6270">track_tokens for every model call</text><rect x="420" y="190" width="380" height="90" rx="8" fill="#ffffff" stroke="#16181d" stroke-width="1.5"/><text x="434" y="216" font-size="16" font-weight="700" fill="#16181d">Private memory</text><text x="434" y="240" font-size="13.5" fill="#5b6270">memory_add after a verified fix</text><text x="434" y="260" font-size="13.5" fill="#5b6270">context_search at triage</text><rect x="420" y="300" width="380" height="100" rx="8" fill="#ffffff" stroke="#0b7a53" stroke-width="2"/><text x="434" y="326" font-size="16" font-weight="700" fill="#16181d">Collective knowledge</text><text x="434" y="350" font-size="13.5" fill="#5b6270">runbook.md uploaded once</text><text x="434" y="370" font-size="13.5" fill="#5b6270">promoted fixes, found with</text><text x="434" y="390" font-size="13.5" fill="#5b6270">knowledgebase_search by both shifts</text><rect x="420" y="420" width="380" height="80" rx="8" fill="#ffffff" stroke="#16181d" stroke-width="1.5"/><text x="434" y="446" font-size="16" font-weight="700" fill="#16181d">Artifacts</text><text x="434" y="470" font-size="13.5" fill="#5b6270">postmortem per resolved page</text><rect x="420" y="520" width="380" height="120" rx="8" fill="#ffffff" stroke="#16181d" stroke-width="1.5"/><text x="434" y="546" font-size="16" font-weight="700" fill="#16181d">Self-learning</text><text x="434" y="570" font-size="13.5" fill="#5b6270">selflearning_status / shortfalls</text><text x="434" y="590" font-size="13.5" fill="#5b6270">Librarian answers weak searches</text><text x="434" y="610" font-size="13.5" fill="#5b6270">selflearning_verify replays them</text><rect x="890" y="60" width="280" height="600" rx="12" fill="none" stroke="#c9cdd4" stroke-width="1.5" stroke-dasharray="6 5"/><text x="904" y="50" font-size="15" font-weight="700" fill="#16181d">Team side</text><rect x="910" y="80" width="240" height="170" rx="8" fill="#ffffff" stroke="#0b7a53" stroke-width="2"/><text x="924" y="106" font-size="16" font-weight="700" fill="#16181d">Postgres fix ledger</text><text x="924" y="130" font-size="13.5" fill="#5b6270">AMP Postgres (SQLite offline)</text><text x="924" y="150" font-size="13.5" fill="#5b6270">fix_validity: valid / retired</text><text x="924" y="170" font-size="13.5" fill="#5b6270">replaced_by, retired_reason</text><text x="924" y="190" font-size="13.5" fill="#5b6270">incidents: steps, tokens,</text><text x="924" y="210" font-size="13.5" fill="#5b6270">accuracy per mode</text><rect x="910" y="300" width="240" height="120" rx="8" fill="#ffffff" stroke="#16181d" stroke-width="1.5"/><text x="924" y="326" font-size="16" font-weight="700" fill="#16181d">Curator</text><text x="924" y="350" font-size="13.5" fill="#5b6270">datapack owner</text><text x="924" y="370" font-size="13.5" fill="#5b6270">end of each night:</text><text x="924" y="390" font-size="13.5" fill="#5b6270">promote valid fixes</text><rect x="910" y="470" width="240" height="120" rx="8" fill="#ffffff" stroke="#16181d" stroke-width="1.5"/><text x="924" y="496" font-size="16" font-weight="700" fill="#16181d">Baseline agent</text><text x="924" y="520" font-size="13.5" fill="#5b6270">same model, same pages</text><text x="924" y="540" font-size="13.5" fill="#5b6270">whole runbook in prompt</text><text x="924" y="560" font-size="13.5" fill="#5b6270">no memory</text><path d="M180,190 L180,240" fill="none" stroke="#16181d" stroke-width="1.6" marker-end="url(#a)"/><text x="188" y="220" font-size="13" fill="#16181d" text-anchor="start">page</text><path d="M310,290 L420,235" fill="none" stroke="#16181d" stroke-width="1.6" marker-end="url(#a)"/><path d="M310,330 L420,350" fill="none" stroke="#16181d" stroke-width="1.6" marker-end="url(#a)"/><text x="318" y="316" font-size="13" fill="#16181d">1 search</text><path d="M310,420 L420,385" fill="none" stroke="#16181d" stroke-width="1.6" marker-end="url(#a)"/><path d="M310,280 L360,280 L360,125 L420,125" fill="none" stroke="#16181d" stroke-width="1.6" marker-end="url(#a)"/><text x="370" y="160" font-size="13" fill="#16181d" text-anchor="start">3 trace</text><path d="M800,235 L850,235 L850,150 L910,150" fill="none" stroke="#16181d" stroke-width="1.6" marker-end="url(#a)"/><text x="855" y="140" font-size="13" fill="#16181d" text-anchor="start">2 still valid?</text><path d="M1030,250 L1030,300" fill="none" stroke="#16181d" stroke-width="1.6" marker-end="url(#a)"/><text x="1038" y="280" font-size="13" fill="#16181d" text-anchor="start">valid, unpromoted</text><path d="M910,360 L800,360" fill="none" stroke="#0b7a53" stroke-width="1.6" marker-end="url(#g)"/><text x="835" y="352" font-size="13" fill="#0b7a53" text-anchor="start">4 promote</text><path d="M420,600 L345,600 L345,508 L310,508" fill="none" stroke="#16181d" stroke-width="1.6" marker-end="url(#a)"/><text x="350" y="594" font-size="13" fill="#16181d" text-anchor="start">gap notes</text><path d="M50,600 L40,600 L40,135 L50,135" fill="none" stroke="#16181d" stroke-width="1.6" marker-end="url(#a)"/><path d="M180,520 L180,560" fill="none" stroke="#16181d" stroke-width="1.6" marker-end="url(#a)"/><path d="M310,470 L420,470" fill="none" stroke="#16181d" stroke-width="1.6" marker-end="url(#a)"/><text x="322" y="462" font-size="13" fill="#16181d" text-anchor="start">5 postmortem</text></svg>